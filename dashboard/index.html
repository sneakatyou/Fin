<style>
.pd {
  --pd-accent: var(--color-fg);
  --pd-fs-table: calc((var(--cds-font-size-caption) + var(--cds-font-size-body)) / 2);
  container: pd / inline-size;
  font-family: var(--font-anthropic-sans);
  font-size: var(--cds-font-size-body);
  color: var(--color-fg);
  line-height: 1.45;
  max-width: 82rem;
  margin-inline: auto;
}
.pd *, .pd *::before, .pd *::after { box-sizing: border-box; }
.pd [hidden] { display: none !important; }
.pd h1, .pd h2, .pd h3, .pd h4, .pd h5, .pd h6, .pd p, .pd ul, .pd ol, .pd dl, .pd dd { margin: 0; }
.pd button, .pd input { font: inherit; color: inherit; }
.pd a { color: inherit; text-underline-offset: 2px; }
.pd :focus-visible { outline: 2px solid var(--color-fg); outline-offset: 2px; }
.pd .pd-dim { color: var(--color-fg-muted); }
.pd .pos { color: var(--color-ok); }
.pd .neg { color: var(--color-bad); }
.pd .pd-pre { white-space: pre-line; overflow-wrap: anywhere; }

/* header and tabs */
.pd .pd-head { display: flex; flex-direction: column; gap: var(--cds-gap-xs); margin-bottom: var(--cds-gap-md); }
.pd .pd-title { font-family: var(--font-anthropic-serif); font-weight: 400; font-size: var(--cds-font-size-title); letter-spacing: -0.01em; line-height: 1.2; }
.pd .pd-takeaway { color: var(--color-fg-muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 1.45em; }
.pd .pd-takeaway.pd-failed { display: flex; justify-content: flex-start; }
.pd .pd-tabs { display: flex; gap: var(--cds-gap-xs); border-bottom: 1px solid var(--color-border-line); overflow-x: auto; margin-bottom: var(--cds-gap-lg); }
.pd .pd-tab { appearance: none; background: none; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; color: var(--color-fg-muted); font-weight: var(--cds-font-weight-medium); padding: var(--cds-pad-sm) var(--cds-pad-md); cursor: pointer; white-space: nowrap; }
.pd .pd-tab:hover { color: var(--color-fg); }
.pd .pd-tab[aria-selected="true"] { color: var(--color-fg); border-bottom-color: var(--pd-accent); }
.pd .pd-panel[hidden] { display: none; }
.pd .pd-stack { display: flex; flex-direction: column; gap: var(--cds-gap-lg); }
.pd .pd-foot { margin-top: var(--cds-gap-xl); color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); }

/* cards */
.pd .pd-card { background: var(--color-panel); border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); padding: var(--cds-pad-lg); min-width: 0; }
.pd .pd-card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--cds-gap-md); flex-wrap: wrap; margin-bottom: var(--cds-gap-md); }
.pd .pd-h2 { font-size: var(--cds-font-size-heading); font-weight: var(--cds-font-weight-medium); line-height: 1.3; }
.pd .pd-h3 { font-size: var(--cds-font-size-body); font-weight: var(--cds-font-weight-medium); margin-bottom: var(--cds-gap-xs); }
.pd .pd-note { color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); margin-top: 2px; }
.pd .pd-mt-md { margin-top: var(--cds-gap-md); }
.pd .pd-mt-sm { margin-top: var(--cds-gap-sm); }
.pd .pd-empty { color: var(--color-fg-muted); padding: var(--cds-pad-sm) 0; }
.pd .pd-box { min-height: 4rem; }
.pd .pd-failed { display: flex; align-items: center; justify-content: center; gap: 0.5rem; color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); }
.pd .pd-failed::before { content: ""; width: 0.375rem; height: 0.375rem; border-radius: 50%; background: var(--color-bad); flex: none; }
.pd .pd-link { font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); white-space: nowrap; }
.pd .pd-link:hover { color: var(--color-fg); }
.pd .pd-btn { appearance: none; background: transparent; border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); padding: var(--cds-pad-xs) var(--cds-pad-sm); font-size: var(--cds-font-size-caption); cursor: pointer; }
.pd .pd-btn:hover { background: color-mix(in srgb, var(--color-fg) 6%, transparent); }
.pd .pd-btn[aria-pressed="true"] { background: color-mix(in srgb, var(--pd-accent) 14%, transparent); border-color: var(--pd-accent); }
.pd .pd-input { background: var(--color-bg); border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); padding: var(--cds-pad-xs) var(--cds-pad-sm); min-width: 0; width: 100%; font-variant-numeric: tabular-nums; }
.pd .pd-card-head .pd-input { width: 13rem; }
.pd .pd-chip { display: inline-flex; align-items: center; gap: 6px; font-size: var(--cds-font-size-caption); line-height: 1.2; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--color-border-line); white-space: nowrap; }
.pd .pd-chip.muted { color: var(--color-fg-muted); }
.pd .pd-chip.ok { color: var(--color-ok); border-color: color-mix(in srgb, var(--color-ok) 45%, transparent); background: color-mix(in srgb, var(--color-ok) 10%, transparent); }
.pd .pd-chip.bad { color: var(--color-bad); border-color: color-mix(in srgb, var(--color-bad) 45%, transparent); background: color-mix(in srgb, var(--color-bad) 10%, transparent); }
.pd .pd-chip.warn { color: var(--color-warn); border-color: color-mix(in srgb, var(--color-warn) 50%, transparent); background: color-mix(in srgb, var(--color-warn) 12%, transparent); }
.pd .pd-chip.tag::before { content: ""; width: 0.5rem; height: 0.5rem; border-radius: 50%; background: var(--chip, var(--color-fg-muted)); flex: none; }

/* figures */
.pd .pd-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 11.5rem), 1fr)); gap: var(--cds-gap-md); }
.pd .pd-kpi { background: var(--color-panel); border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); padding: var(--cds-pad-md) var(--cds-pad-lg); display: flex; flex-direction: column; gap: 4px; min-width: 0; min-height: 6.5rem; }
.pd .pd-kpi.wide { grid-column: 1 / -1; }
.pd .pd-kpi-label { color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); }
.pd .pd-kpi-value { font-family: var(--font-anthropic-serif); font-weight: 400; font-size: var(--cds-font-size-title); line-height: 1.15; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.pd .pd-kpi-sub { color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); font-variant-numeric: tabular-nums; }
.pd .pd-kpi-sub .pos { color: var(--color-ok); }
.pd .pd-kpi-sub .neg { color: var(--color-bad); }

/* regime and pulse */
.pd .pd-regime { display: flex; gap: var(--cds-gap-lg); flex-wrap: wrap; align-items: flex-start; justify-content: space-between; }
.pd .pd-regime-main { flex: 1 1 18rem; min-width: 0; display: flex; flex-direction: column; gap: var(--cds-gap-sm); }
.pd .pd-regime-top { display: flex; align-items: center; gap: var(--cds-gap-sm); flex-wrap: wrap; color: var(--color-fg-muted); }
.pd .pd-regime-regime { font-size: var(--cds-font-size-heading); font-weight: var(--cds-font-weight-medium); }
.pd .pd-regime-headline { color: var(--color-fg-muted); }
.pd .pd-stat { flex: none; display: flex; flex-direction: column; gap: 2px; min-width: 6rem; }
.pd .pd-stat-n { font-family: var(--font-anthropic-serif); font-weight: 400; font-size: var(--cds-font-size-title); line-height: 1.1; font-variant-numeric: tabular-nums; }
.pd .pd-key { border-left: 3px solid var(--pd-accent); background: color-mix(in srgb, var(--pd-accent) 9%, var(--color-panel)); border-radius: 0 var(--cds-radius) var(--cds-radius) 0; padding: var(--cds-pad-md) var(--cds-pad-lg); margin-bottom: var(--cds-gap-md); }
.pd .pd-key-t { font-size: var(--cds-font-size-body); font-weight: var(--cds-font-weight-medium); margin-bottom: var(--cds-gap-xs); }
.pd .pd-clip { max-height: 28rem; overflow: hidden; position: relative; }
.pd .pd-clip.open { max-height: none; }
.pd .pd-clip.is-clipped:not(.open)::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3.5rem; background: linear-gradient(to bottom, transparent, var(--color-panel)); pointer-events: none; }
.pd .pd-clip + .pd-btn { margin-top: var(--cds-gap-sm); }

/* rendered notion text */
.pd .nr { overflow-wrap: anywhere; }
.pd .nr h3 { font-size: var(--cds-font-size-heading); font-weight: var(--cds-font-weight-medium); margin: 1.1em 0 0.35em; }
.pd .nr h4 { font-size: var(--cds-font-size-body); font-weight: var(--cds-font-weight-medium); margin: 1em 0 0.3em; }
.pd .nr h5, .pd .nr h6 { font-size: var(--cds-font-size-body); font-weight: var(--cds-font-weight-medium); color: var(--color-fg-muted); margin: 0.9em 0 0.25em; }
.pd .nr > :first-child { margin-top: 0; }
.pd .nr p { margin: 0.4em 0; }
.pd .nr ul, .pd .nr ol { margin: 0.25em 0 0.25em 1.25em; padding: 0; }
.pd .nr li { margin: 0.15em 0; }
.pd .nr hr { border: 0; border-top: 1px solid var(--color-border-line); margin: 0.8em 0; }
.pd .nr blockquote { margin: 0.4em 0; padding-left: 0.8em; border-left: 3px solid var(--color-border-line); color: var(--color-fg-muted); }
.pd .nr code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.92em; background: color-mix(in srgb, var(--color-fg) 7%, transparent); padding: 0 4px; border-radius: 4px; }
.pd .nr .nr-pre { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: var(--cds-font-size-caption); background: color-mix(in srgb, var(--color-fg) 6%, transparent); padding: var(--cds-pad-sm); border-radius: var(--cds-radius); overflow-x: auto; white-space: pre; margin: 0.5em 0; }
.pd .nr .nr-callout, .pd .nr .nr-details { background: color-mix(in srgb, var(--color-fg) 5%, transparent); border-radius: var(--cds-radius); padding: var(--cds-pad-xs) var(--cds-pad-md); margin: 0.6em 0; }
.pd .nr .nr-summary { font-weight: var(--cds-font-weight-medium); }
.pd .nr strong { font-weight: 600; }
.pd .nr .nr-tw { overflow-x: auto; margin: 0.6em 0; }
.pd .nr table { border-collapse: collapse; min-width: 100%; font-size: var(--pd-fs-table); font-variant-numeric: tabular-nums; }
.pd .nr th, .pd .nr td { border: 1px solid var(--color-border-line); padding: 4px 8px; text-align: left; vertical-align: top; }
.pd .nr th { background: color-mix(in srgb, var(--color-fg) 6%, transparent); font-weight: var(--cds-font-weight-medium); }

/* setups */
.pd .pd-setups { display: grid; gap: var(--cds-gap-md); }
.pd .pd-setup { border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); background: var(--color-bg); padding: var(--cds-pad-md) var(--cds-pad-lg); display: flex; flex-direction: column; gap: var(--cds-gap-sm); min-width: 0; }
.pd .pd-setup-head { display: flex; align-items: center; gap: var(--cds-gap-sm); flex-wrap: wrap; }
.pd .pd-setup-id { font-weight: 600; font-variant-numeric: tabular-nums; }
.pd .pd-setup-meta { color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); }
.pd .pd-setup-inst { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; white-space: pre-line; }
.pd .pd-blks { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 13rem), 1fr)); gap: var(--cds-gap-md); }
.pd .pd-blk { min-width: 0; }
.pd .pd-blk-l { color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); margin-bottom: 2px; }
.pd .pd-blk-v { white-space: pre-line; overflow-wrap: anywhere; }
.pd .pd-setup details { border-top: 1px solid var(--color-border-line); padding-top: var(--cds-pad-sm); }
.pd .pd-setup summary { cursor: pointer; font-weight: var(--cds-font-weight-medium); font-size: var(--cds-font-size-caption); }
.pd .pd-setup details > :not(summary) { margin-top: var(--cds-gap-sm); }

/* day gate */
.pd .pd-gate { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 22rem), 1fr)); gap: var(--cds-gap-xl); }
.pd .pd-gate-col { display: flex; flex-direction: column; gap: var(--cds-gap-md); min-width: 0; }
.pd .pd-fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 9.5rem), 1fr)); gap: var(--cds-gap-md); }
.pd .pd-field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.pd .pd-field label, .pd .pd-field .pd-lab { color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); }
.pd .pd-seg { display: flex; gap: var(--cds-gap-xs); }
.pd .pd-seg .pd-btn { flex: 1; padding: var(--cds-pad-sm); }
.pd .pd-toggles { display: flex; gap: var(--cds-gap-sm); flex-wrap: wrap; }
.pd .pd-verdict { border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); padding: var(--cds-pad-md) var(--cds-pad-lg); display: flex; flex-direction: column; gap: var(--cds-gap-xs); }
.pd .pd-verdict-word { font-family: var(--font-anthropic-serif); font-weight: 400; font-size: var(--cds-font-size-title); line-height: 1.2; color: var(--color-fg-muted); }
.pd .pd-verdict[data-v="go"] { border-color: color-mix(in srgb, var(--color-ok) 55%, transparent); }
.pd .pd-verdict[data-v="go"] .pd-verdict-word { color: var(--color-ok); }
.pd .pd-verdict[data-v="skip"] { border-color: color-mix(in srgb, var(--color-bad) 55%, transparent); }
.pd .pd-verdict[data-v="skip"] .pd-verdict-word { color: var(--color-bad); }
.pd .pd-verdict-why { padding-left: 1.1em; }
.pd .pd-verdict-why:empty { display: none; }
.pd .pd-warn { color: var(--color-warn); font-size: var(--cds-font-size-caption); }
.pd .pd-out { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 9rem), 1fr)); gap: var(--cds-gap-sm) var(--cds-gap-md); }
.pd .pd-out dt { color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); }
.pd .pd-out dd { font-variant-numeric: tabular-nums; font-weight: var(--cds-font-weight-medium); }

/* charts */
.pd .pd-chart { position: relative; min-height: 8rem; }
.pd .pd-chart svg { display: block; }
.pd .pd-ct { font-family: var(--font-anthropic-sans); font-size: var(--cds-font-size-caption); fill: var(--color-fg-muted); }
.pd .pd-ct.v { fill: var(--color-fg); font-variant-numeric: tabular-nums; }
.pd .pd-row { outline: none; }
.pd .pd-hit { fill: transparent; }
.pd .pd-row:hover .pd-hit { fill: color-mix(in srgb, var(--color-fg) 6%, transparent); }
.pd .pd-row:focus-visible .pd-hit { fill: color-mix(in srgb, var(--color-fg) 6%, transparent); stroke: var(--color-fg); stroke-width: 2; }
.pd .pd-tip { position: absolute; z-index: 5; pointer-events: none; background: var(--cds-surface-popover); border: 1px solid var(--cds-border); border-radius: var(--cds-radius); box-shadow: var(--cds-shadow-popover); padding: var(--cds-pad-xs) var(--cds-pad-sm); font-size: var(--cds-font-size-caption); white-space: nowrap; }
.pd .pd-tip-h { color: var(--cds-text-secondary); }
.pd .pd-tip-l { display: flex; justify-content: space-between; gap: var(--cds-gap-md); font-variant-numeric: tabular-nums; }

/* tables */
.pd .pd-tablewrap { max-height: 32rem; overflow: auto; border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); background: var(--color-panel); }
.pd .pd-tablewrap.short { max-height: 24rem; }
.pd .pd-table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: var(--pd-fs-table); font-variant-numeric: tabular-nums; }
.pd .pd-table th { position: sticky; top: 0; z-index: 2; background: var(--color-panel); border-bottom: 1px solid var(--color-border-line); text-align: left; padding: 0; white-space: nowrap; }
.pd .pd-table td { padding: 6px 10px; border-bottom: 1px solid color-mix(in srgb, var(--color-border-line) 60%, transparent); white-space: nowrap; vertical-align: top; }
.pd .pd-table tbody tr:last-child td { border-bottom: 0; }
.pd .pd-table tbody tr:hover td { background: color-mix(in srgb, var(--color-fg) 4%, var(--color-panel)); }
.pd .pd-table tbody tr.sel td { background: color-mix(in srgb, var(--pd-accent) 12%, var(--color-panel)); }
.pd .pd-table tbody tr[tabindex] { cursor: pointer; }
.pd .pd-table .num { text-align: right; }
.pd .pd-table th.stick, .pd .pd-table td.stick { position: sticky; left: 0; background: var(--color-panel); }
.pd .pd-table th.stick { z-index: 3; }
.pd .pd-table td.stick { z-index: 1; font-weight: var(--cds-font-weight-medium); }
.pd .pd-table td.wrapc { white-space: normal; min-width: 12rem; max-width: 26rem; }
.pd .pd-sort { appearance: none; background: none; border: 0; cursor: pointer; width: 100%; text-align: inherit; padding: 8px 10px; color: var(--color-fg-muted); font-weight: var(--cds-font-weight-medium); white-space: nowrap; }
.pd .pd-sort:hover { color: var(--color-fg); }
.pd .pd-table th[aria-sort="ascending"] .pd-sort::after { content: " \2191"; }
.pd .pd-table th[aria-sort="descending"] .pd-sort::after { content: " \2193"; }
.pd .pd-table th[aria-sort="ascending"] .pd-sort, .pd .pd-table th[aria-sort="descending"] .pd-sort { color: var(--color-fg); }
.pd .pd-table td.stale::after { content: "stale"; margin-left: 6px; font-size: var(--cds-font-size-caption); color: var(--color-warn); border: 1px solid color-mix(in srgb, var(--color-warn) 50%, transparent); border-radius: 999px; padding: 0 6px; }
.pd .wcell { display: flex; align-items: center; gap: 6px; justify-content: flex-end; }
.pd .w-track { width: 3.5rem; height: 6px; border-radius: 3px; background: color-mix(in srgb, var(--color-fg) 10%, transparent); overflow: hidden; flex: none; }
.pd .w-fill { display: block; height: 100%; background: var(--pd-accent); border-radius: 3px; }
.pd .clamp { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; white-space: pre-line; overflow-wrap: anywhere; }
.pd .clamp.c2 { -webkit-line-clamp: 2; }
.pd .clamp.c3 { -webkit-line-clamp: 3; }
.pd .clamp.open { display: block; overflow: visible; }

/* proposals and waiting */
.pd .pd-sublist { list-style: none; padding: 0; display: flex; flex-direction: column; gap: var(--cds-gap-md); margin-bottom: var(--cds-gap-lg); }
.pd .pd-prop { border-left: 3px solid var(--color-border-line); padding-left: var(--cds-pad-md); display: flex; flex-direction: column; gap: 4px; }
.pd .pd-prop-h { display: flex; align-items: center; gap: var(--cds-gap-sm); flex-wrap: wrap; }
.pd .pd-gaps { padding-left: 1.2em; display: flex; flex-direction: column; gap: var(--cds-gap-xs); }

/* research */
.pd .pd-detail { margin-top: var(--cds-gap-md); border-top: 1px solid var(--color-border-line); padding-top: var(--cds-pad-md); display: flex; flex-direction: column; gap: var(--cds-gap-md); }
.pd .pd-pipe { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 12.5rem), 1fr)); gap: var(--cds-gap-md); align-items: start; }
.pd .pd-col { background: var(--color-bg); border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); padding: var(--cds-pad-sm); display: flex; flex-direction: column; gap: var(--cds-gap-sm); min-width: 0; min-height: 5rem; }
.pd .pd-pipe.pd-failed { display: flex; }
.pd .pd-col-head { display: flex; justify-content: space-between; align-items: baseline; font-weight: var(--cds-font-weight-medium); padding: 2px 4px; }
.pd .pd-col-head .n { color: var(--color-fg-muted); font-variant-numeric: tabular-nums; }
.pd .pd-hcard { appearance: none; text-align: left; width: 100%; background: var(--color-panel); border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); padding: var(--cds-pad-sm) var(--cds-pad-md); cursor: pointer; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.pd .pd-hcard:hover { border-color: var(--color-fg-muted); }
.pd .pd-hcard[aria-pressed="true"] { border-color: var(--pd-accent); background: color-mix(in srgb, var(--pd-accent) 10%, var(--color-panel)); }
.pd .pd-hcard-n { font-weight: var(--cds-font-weight-medium); overflow-wrap: anywhere; }
.pd .pd-hcard-m { color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); font-variant-numeric: tabular-nums; }

/* log */
.pd .pd-logbar { display: flex; gap: var(--cds-gap-xs); flex-wrap: wrap; margin-bottom: var(--cds-gap-md); }
.pd .pd-log { list-style: none; padding: 0; margin: 0 0 0 6px; border-left: 2px solid var(--color-border-line); }
.pd .pd-log-item { position: relative; padding: 0 0 var(--cds-pad-lg) var(--cds-pad-lg); display: flex; flex-direction: column; gap: 4px; }
.pd .pd-log-item::before { content: ""; position: absolute; left: -7px; top: 0.4em; width: 12px; height: 12px; border-radius: 50%; background: var(--chip, var(--color-fg-muted)); border: 2px solid var(--color-panel); }
.pd .pd-log-top { display: flex; align-items: center; gap: var(--cds-gap-sm); flex-wrap: wrap; font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); font-variant-numeric: tabular-nums; }
.pd .pd-log-top .pd-link { margin-left: auto; }
.pd .pd-log-title { font-weight: var(--cds-font-weight-medium); overflow-wrap: anywhere; }
.pd .pd-log-headline { overflow-wrap: anywhere; white-space: pre-line; }

<script>
/* ===== Loaders: Notion answers become rows ===== */
const joinPages = async ({ answer, call, args }) => {
  const parse = (x) => {
    if (typeof x !== 'string') return x;
    try { return JSON.parse(x); } catch (e) { throw new Error(x.slice(0, 400)); }
  };
  let a = parse(answer);
  const rows = [];
  let extra = 0;
  for (;;) {
    if (!a || !Array.isArray(a.results)) {
      const m = a && (a.message || a.error || a.text);
      throw new Error(typeof m === 'string' ? m : 'Notion returned no results' + (a && typeof a === 'object' ? ' (keys: ' + Object.keys(a).join(', ') + ')' : ''));
    }
    rows.push(...a.results);
    if (!(a.has_more && a.next_cursor) || extra >= 5) break;
    extra++;
    a = parse(await call('notion-query-data-sources', { data: { ...args.data, start_cursor: a.next_cursor } }));
  }
  const columns = [];
  for (const r of rows) for (const k of Object.keys(r)) if (!columns.includes(k)) columns.push(k);
  return { data: rows, columns, cut: !!a.has_more };
};
['portfolio', 'ledger', 'lab', 'pulse'].forEach((id) => {
  dash.loader(id, { description: 'Notion returns 100 rows a page; this joins the pages.', fn: joinPages });
});

dash.loader('latest_pulse', {
  description: 'Finds the newest pre-market pulse and reads its page.',
  fn: async ({ answer, call, args }) => {
    const parse = (x) => {
      if (typeof x !== 'string') return x;
      try { return JSON.parse(x); } catch (e) { throw new Error(x.slice(0, 400)); }
    };
    let a = parse(answer);
    const rows = [];
    let extra = 0;
    for (;;) {
      if (!a || !Array.isArray(a.results)) {
        const m = a && (a.message || a.error || a.text);
        throw new Error(typeof m === 'string' ? m : 'Notion returned no results' + (a && typeof a === 'object' ? ' (keys: ' + Object.keys(a).join(', ') + ')' : ''));
      }
      rows.push(...a.results);
      if (!(a.has_more && a.next_cursor) || extra >= 5) break;
      extra++;
      a = parse(await call('notion-query-data-sources', { data: { ...args.data, start_cursor: a.next_cursor } }));
    }
    const pre = rows.filter((r) => r.Type === 'Pre-market pulse');
    if (!pre.length) return [];
    const day = (r) => String(r['date:Date:start'] || '');
    let best = pre[0];
    for (const r of pre.slice(1)) {
      if (day(r) > day(best) || (day(r) === day(best) && String(r.createdTime || '') > String(best.createdTime || ''))) best = r;
    }
    let page = await call('notion-fetch', { id: best.url });
    if (typeof page === 'string') {
      try { const p = JSON.parse(page); if (p && typeof p === 'object') page = p; } catch (e) { /* plain text page */ }
    }
    const text = typeof page === 'string' ? page : page && page.text;
    if (typeof text !== 'string') {
      const m = page && (page.message || page.error);
      throw new Error(typeof m === 'string' ? m : 'The pulse page came back without text');
    }
    const i = text.indexOf('<content>');
    const j = text.lastIndexOf('</content>');
    const body = (i >= 0 && j > i ? text.slice(i + 9, j) : text).trim();
    return [{
      Title: best.Title,
      Date: best['date:Date:start'],
      Headline: best.Headline,
      Regime: best.Regime,
      'Setups proposed': best['Setups proposed'],
      url: best.url,
      Body: body,
    }];
  },
});

dash.loader('collateral', {
  description: 'Reads the Collateral and Stress Test page body.',
  fn: ({ answer }) => {
    let a = answer;
    if (typeof a === 'string') {
      try { const p = JSON.parse(a); if (p && typeof p === 'object') a = p; } catch (e) { throw new Error(a.slice(0, 400)); }
    }
    if (!a || typeof a.text !== 'string') {
      const m = a && (a.message || a.error);
      throw new Error(typeof m === 'string' ? m : 'The page came back without text');
    }
    const i = a.text.indexOf('<content>');
    const j = a.text.lastIndexOf('</content>');
    const body = (i >= 0 && j > i ? a.text.slice(i + 9, j) : a.text).trim();
    return [{ Title: a.title, url: a.url, Body: body }];
  },
});

/* ===== Calcs ===== */
dash.calc('totals', {
  title: 'Portfolio totals',
  description: 'Books, P&L, Vedanta share and largest position from Holding rows and the USD/INR rate.',
  inputs: ['portfolio', 'fx'],
  fn: (portfolio, fx) => {
    const n = (v) => (v === null || v === undefined || v === '' || !isFinite(Number(v)) ? 0 : Number(v));
    const rate = n(fx[0] && fx[0].rate);
    const held = portfolio.filter((r) => r.Status === 'Holding');
    const sum = (list, k) => list.reduce((s, r) => s + n(r[k]), 0);
    const inr = (r) => n(r['Current value']) * (r.Currency === 'USD' ? rate : 1);
    const acct = (a) => held.filter((r) => r.Account === a);

dash.calc('by_theme', {

dash.calc('setup_stats', {

/* ---- today: day gate (rules are the owner's constants) ---- */
function initGate() {
  const readNum = (id) => { const v = $(id).value.trim(); return v === '' || !isFinite(Number(v)) ? null : Number(v); };
  const flag = (id) => $(id).getAttribute('aria-pressed') === 'true';
  const fmt = (n) => String(Math.round(n * 100) / 100);
  function gate() {
    const gap = readNum('gate-gap'), vix = readNum('gate-vix'), mv = readNum('gate-vixmove');
    const ev = flag('gate-event'), dv = flag('gate-diverge');
    const why = [];
    if (gap !== null && Math.abs(gap) > RULES.gap) why.push('Opening gap of ' + fmt(gap) + '% is beyond ±' + RULES.gap.toFixed(2) + '%.');
    if (mv !== null && Math.abs(mv) > RULES.vixMove) why.push('VIX moved ' + fmt(mv) + '% today, beyond ±' + RULES.vixMove + '%.');
    if (ev) why.push('A high-impact event falls inside 09:15–14:30.');
    if (dv) why.push('Heavyweights are diverging.');
    const any = gap !== null || vix !== null || mv !== null || ev || dv;
    const v = why.length ? 'skip' : any ? 'go' : 'wait';
    $('gate-verdict').dataset.v = v;
    $('gate-word').textContent = v === 'skip' ? 'SKIP' : v === 'go' ? 'GO' : 'Enter the opening numbers';
    $('gate-why').replaceChildren(...why.map((t) => el('li', null, t)));
    const note = $('gate-vixnote');
    let t = '';
    if (vix !== null) {
      if (vix < RULES.vixLow) t = 'chop and false-breakout risk';
      else if (vix < RULES.vixMidLo) t = 'between the chop and momentum bands, no clear read';
      else if (vix <= RULES.vixMidHi) t = 'momentum range';
      else if (vix <= RULES.vixHigh) t = 'between the momentum and whipsaw bands, no clear read';
      else t = 'whipsaw risk: cut size or skip';
      t = 'VIX at ' + fmt(vix) + ': ' + t + '.';
    }
    note.hidden = !t;
    note.textContent = t;
  }
  ['gate-gap', 'gate-vix', 'gate-vixmove'].forEach((id) => $(id).addEventListener('input', gate));
  ['gate-event', 'gate-diverge'].forEach((id) => $(id).addEventListener('click', () => {
    $(id).setAttribute('aria-pressed', String(!flag(id)));
    gate();
  }));

  let dir = 'Long';
  function size() {
    const risk = readNum('size-risk'), entry = readNum('size-entry'), stop = readNum('size-stop');
    const sign = dir === 'Long' ? 1 : -1;
    const sg = sign > 0 ? '+' : MINUS;
    $('size-t1-l').textContent = 'T1, book half (' + sg + RULES.t1.toFixed(2) + '%)';
    $('size-t2-l').textContent = 'T2, trail to cost (' + sg + RULES.t2.toFixed(2) + '%)';
    const out = ['size-qty', 'size-val', 'size-loss', 'size-t1', 'size-t2'];
    const warn = $('size-warn');
    const reset = (msg) => { out.forEach((id) => { $(id).textContent = '—'; }); warn.hidden = !msg; warn.textContent = msg || ''; };
    if (risk === null || entry === null || stop === null) { reset(''); return; }
    if (entry <= 0 || stop <= 0 || risk <= 0) { reset('Risk, entry and stop must be above zero.'); return; }
    if (entry === stop) { reset('Entry and stop are the same price.'); return; }
    if ((dir === 'Long' && stop > entry) || (dir === 'Short' && stop < entry)) {
      reset('The stop is on the wrong side of entry for a ' + dir.toLowerCase() + '. A ' + dir.toLowerCase() + ' needs the stop ' + (dir === 'Long' ? 'below' : 'above') + ' entry.');
      return;
    }
    const dist = Math.abs(entry - stop);
    const qty = Math.floor(risk / dist);
    warn.hidden = qty > 0;
    warn.textContent = qty > 0 ? '' : 'Risk is too small for one share at this stop distance.';
    $('size-qty').textContent = F.in0.format(qty);
    $('size-val').textContent = inr(qty * entry, 'f');
    $('size-loss').textContent = inr(qty * dist, 'f');
    $('size-t1').textContent = inr(entry * (1 + sign * RULES.t1 / 100), 'p');
    $('size-t2').textContent = inr(entry * (1 + sign * RULES.t2 / 100), 'p');
  }
  ['size-risk', 'size-entry', 'size-stop'].forEach((id) => $(id).addEventListener('input', size));
  const setDir = (d) => {
    dir = d;
    $('size-long').setAttribute('aria-pressed', String(d === 'Long'));
    $('size-short').setAttribute('aria-pressed', String(d === 'Short'));
    size();
  };
  $('size-long').addEventListener('click', () => setDir('Long'));
  $('size-short').addEventListener('click', () => setDir('Short'));
  gate();
  size();
}

function drawThemes(box, data) {
  box.replaceChildren();
  const W = Math.floor(box.clientWidth);
  if (W < 60) return;
  const accent = dash.colors[0];
  const svg = d3.select(box).append('svg').attr('width', '100%').attr('role', 'img').attr('aria-label', 'Bar chart of portfolio value by theme');
  const measure = (txt, cls) => { const t = svg.append('text').attr('class', 'pd-ct ' + (cls || '')).text(txt); const w = t.node().getComputedTextLength(); t.remove(); return w; };
  const endTxt = (d) => inr(d.value_inr) + ' · ' + pct(d.share, 1);
  const endW = d3.max(data, (d) => measure(endTxt(d), 'v'));
  let labelW = Math.min(d3.max(data, (d) => measure(d.Theme)), W * 0.36);
  const stacked = W < 480 || W - labelW - 12 - endW - 8 < 90;
  if (stacked) labelW = 0;
  const x0 = stacked ? 0 : labelW + 12;
  const barMax = stacked ? W : W - x0 - endW - 8;
  const sx = d3.scaleLinear([0, d3.max(data, (d) => d.value_inr) || 1], [0, barMax]);
  const rowH = stacked ? 40 : 30, barH = stacked ? 10 : 14, pad = 4;
  const H = pad * 2 + data.length * rowH;
  svg.attr('viewBox', '0 0 ' + W + ' ' + H).attr('height', H);
  const tip = makeTip(box);
  const fit = (sel, label, maxW) => {
    let s = label;
    sel.text(s);
    while (sel.node().getComputedTextLength() > maxW && s.length > 1) { s = s.slice(0, -1); sel.text(s.trimEnd() + '…'); }
  };
  const lines = (d) => [['Value', inr(d.value_inr, 'f')], ['Share', pct(d.share, 1)], ['Holdings', cnt(d.positions)]];
  data.forEach((d, i) => {
    const y = pad + i * rowH;
    const w = Math.max(2, sx(d.value_inr));
    const g = svg.append('g').attr('class', 'pd-row').attr('tabindex', 0).attr('aria-label', d.Theme + ': ' + endTxt(d));
    g.append('rect').attr('class', 'pd-hit').attr('x', 0).attr('y', y).attr('width', W).attr('height', rowH).attr('rx', 4);
    const fill = i === 0 ? accent : 'var(--cds-chart-muted)';
    if (stacked) {
      fit(g.append('text').attr('class', 'pd-ct').attr('x', 0).attr('y', y + 15), d.Theme, W - endW - 12);
      g.append('text').attr('class', 'pd-ct v').attr('x', W).attr('y', y + 15).attr('text-anchor', 'end').text(endTxt(d));
      g.append('rect').attr('x', 0).attr('y', y + 22).attr('width', w).attr('height', barH).attr('rx', 4).style('fill', fill);
    } else {
      fit(g.append('text').attr('class', 'pd-ct').attr('x', 0).attr('y', y + rowH / 2).attr('dy', '0.35em'), d.Theme, labelW);
      g.append('rect').attr('x', x0).attr('y', y + (rowH - barH) / 2).attr('width', w).attr('height', barH).attr('rx', 4).style('fill', fill);
      g.append('text').attr('class', 'pd-ct v').attr('x', x0 + w + 6).attr('y', y + rowH / 2).attr('dy', '0.35em').text(endTxt(d));
    }
    g.on('pointermove', (e) => { const b = box.getBoundingClientRect(); tip.show(d.Theme, lines(d), e.clientX - b.left, e.clientY - b.top); })
      .on('pointerleave', () => tip.hide())
      .on('focus', () => tip.show(d.Theme, lines(d), Math.min(W - 20, x0 + w), y + rowH / 2))
      .on('blur', () => tip.hide());
  });
}

/* ---- portfolio: waiting on you ---- */
function proposalOf(notes) {
  const s = String(notes || '').replace(/\r/g, '');
  const i = s.indexOf('PROPOSED (');
  if (i < 0) return null;
  let rest = s.slice(i);
  const dbl = /<br\s*\/?>\s*<br\s*\/?>|\n\s*\n/i.exec(rest);
  if (dbl) rest = rest.slice(0, dbl.index);
  else { const one = /<br\s*\/?>|\n/i.exec(rest); if (one) rest = rest.slice(0, one.index); }
  return clean(rest);
}
function proposedLabel(text, current) {
  const body = text.replace(/^PROPOSED \([^)]*\):?/, '');
  const find = (skip) => {
    let best = null;
    for (const c of CLASSES) {
      const i = body.indexOf(c);
      if (i >= 0 && !(skip && c === current) && (best === null || i < best.i)) best = { c, i };
    }
    return best;
  };
  const b = find(true) || find(false);
  return b ? b.c : null;
}
function renderWaiting() {
  const box = $('waiting-body');
  if (!gateBox(box, stOf('portfolio', 'data_gaps'))) return;
  const g = oneOf('data_gaps');
  const props = rowsOf('portfolio').filter((r) => r.Status === 'Holding' && proposalOf(r['Thesis and notes']));
  box.replaceChildren();
  box.append(el('h3', 'pd-h3', 'Classification proposals'));
  if (!props.length) box.append(empty('No classification proposals are waiting for a yes or no.'));
  else {
    const ul = el('ul', 'pd-sublist');
    props.forEach((r) => {
      const text = proposalOf(r['Thesis and notes']);
      const li = el('li', 'pd-prop');
      const h = el('div', 'pd-prop-h');
      h.append(mark(el('strong', null, r.Ticker), 'portfolio', 'Ticker', { Ticker: r.Ticker }));
      h.append(chip('now ' + (clean(r.Classification) || 'Unclassified'), 'muted'));
      const label = proposedLabel(text, clean(r.Classification));
      if (label) h.append(chip('proposed: ' + label));
      li.append(h, el('p', 'pd-pre', text));
      ul.append(li);
    });
    box.append(ul);
  }
  box.append(el('h3', 'pd-h3', 'Data gaps'));
  const gl = el('ul', 'pd-gaps');
  if (g) {
    const a = el('li');
    a.append(ms(cnt(g.unverified_pledged_india), 'data_gaps', 'unverified_pledged_india', 0), ' Indian holdings have an unverified pledge status' + (g.unverified_tickers ? ' (' + g.unverified_tickers + ')' : '') + '. Which stocks are pledged, and their haircuts, are unverified.');
    const b = el('li');
    b.append(ms(cnt(g.no_qty), 'data_gaps', 'no_qty', 0), ' holdings have no quantity' + (g.no_qty_tickers ? ' (' + g.no_qty_tickers + ')' : '') + ', so their value is the approximate figure you gave.');
    gl.append(a, b);
  }
  box.append(gl);
}

/* ---- research: record, ledger, pipeline, rejected ---- */
const SEL = { setup: null, hyp: null };
function renderStats() {
  const st = stOf('setup_stats');

  const whole = cnt;
  setTile('kpi-frozen', st, ok, ok && whole(s.frozen), () => {});
  setTile('kpi-open', st, ok, ok && whole(s.open), () => {});
  setTile('kpi-trig', st, ok, ok && whole(s.triggered), () => {});

  setTile('kpi-avgr', st, ok, ok && rfmt(s.avg_theoretical_R), (sub) => {
    sub.append('n = ', ms(whole(s.scored), 'setup_stats', 'scored', 0));
  });
  if (ok) {

}
const rCell = (f) => (td, r) => { const v = num(r[f]); if (v === null) { dim(td); return; } td.textContent = rfmt(v); td.classList.add(sgn(v)); };
const firstSentence = (t) => { const m = /^[\s\S]*?[.!?](?=\s|$)/.exec(t); return m ? m[0] : t; };

function stageOf(r) { return r.Stage || 'Hypothesis'; }

  b.append(m);

/* ---- log ---- */
const LOGF = { f: 'all', n: 30 };
function logItem(r) {
  const w = { Title: r.Title };
  const li = el('li', 'pd-log-item');
  li.style.setProperty('--chip', dash.colors[LOG_TYPES[r.Type] !== undefined ? LOG_TYPES[r.Type] : 0]);
  const top = el('div', 'pd-log-top');
  top.append(mark(el('span', null, dayStr(r['date:Date:start'])), 'pulse', 'date:Date:start', w));
  if (r.Type) top.append(mark(chip(r.Type, 'tag'), 'pulse', 'Type', w));
  const u = safeUrl(r.url);
  if (u) {
    const a = el('a', 'pd-link', 'Open');
    a.href = u; a.target = '_blank'; a.rel = 'noopener';
    a.setAttribute('aria-label', 'Open ' + (clean(r.Title) || 'entry') + ' in Notion');
    top.append(a);
  }
  li.append(top);
  li.append(fillText(el('div', 'pd-log-title'), r.Title, 'pulse', 'Title', w));
  if (clean(r.Headline)) li.append(fillText(el('div', 'pd-log-headline'), r.Headline, 'pulse', 'Headline', w));
  const reg = clean(r.Regime);
  if (reg) {
    const d = el('div', 'pd-log-regime');
    const k = 'log:' + r.Title;
    const c = el('div', 'clamp c2', reg);
    c.tabIndex = 0;
    c.setAttribute('role', 'button');
    const set = (o) => { c.classList.toggle('open', o); c.setAttribute('aria-expanded', String(o)); };
    set(OPENED.has(k));
    const flip = () => { const o = !c.classList.contains('open'); if (o) OPENED.add(k); else OPENED.delete(k); set(o); };
    c.addEventListener('click', flip);
    c.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); } });
    if (reg === String(r.Regime)) mark(c, 'pulse', 'Regime', w);
    d.append(c);
    li.append(d);
  }
  return li;
}
function renderLog() {
  const box = $('log-list'), more = $('log-more');
  if (!gateBox(box, stOf('pulse'))) { more.hidden = true; return; }
  const all = rowsOf('pulse').filter((r) => LOGF.f === 'all' || r.Type === LOGF.f);
  all.sort((a, b) => cmp(a['date:Date:start'], b['date:Date:start'], 'desc')
    || cmp(LOG_PRI[a.Type] === undefined ? 9 : LOG_PRI[a.Type], LOG_PRI[b.Type] === undefined ? 9 : LOG_PRI[b.Type], 'asc')
    || cmp(a.Title, b.Title, 'asc'));
  if (!all.length) { box.replaceChildren(empty('Nothing logged yet.')); more.hidden = true; return; }
  const ol = el('ol', 'pd-log');
  ol.append(...all.slice(0, LOGF.n).map(logItem));
  box.replaceChildren(ol);
  more.hidden = all.length <= LOGF.n;
}

    renderLog();
  });
  $('log-more').addEventListener('click', () => { LOGF.n += 30; renderLog(); });
};
