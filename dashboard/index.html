<style>
/* ===== Portfolio Desk: tonal surfaces, expressive shapes, 8px rhythm ===== */
.pd {
  --pd-accent: var(--color-fg);
  /* spacing, 8px rhythm */
  --pd-s1: 0.5rem; --pd-s2: 1rem; --pd-s3: 1.5rem; --pd-s4: 2rem; --pd-s5: 3rem;
  /* shape scale: hero > card > tile > nested > small > pill */
  --pd-r-hero: 28px; --pd-r-card: 24px; --pd-r-tile: 20px; --pd-r-in: 16px; --pd-r-sm: 12px; --pd-r-pill: 999px;
  /* tonal containers, built from the theme tokens */
  --pd-t1: color-mix(in oklab, var(--color-panel), var(--color-fg) 3%);
  --pd-t2: color-mix(in oklab, var(--color-panel), var(--color-fg) 7%);
  --pd-t3: color-mix(in oklab, var(--color-panel), var(--color-fg) 12%);
  --pd-ac1: color-mix(in oklab, var(--color-panel), var(--pd-accent) 13%);
  --pd-ac2: color-mix(in oklab, var(--color-panel), var(--pd-accent) 26%);
  --pd-line: color-mix(in oklab, var(--color-border-line), transparent 45%);
  --pd-ok-bg: color-mix(in oklab, var(--color-panel), var(--color-ok) 17%);
  --pd-warn-bg: color-mix(in oklab, var(--color-panel), var(--color-warn) 19%);
  --pd-bad-bg: color-mix(in oklab, var(--color-panel), var(--color-bad) 17%);
  --pd-ok-fg: color-mix(in oklab, var(--color-ok) 80%, var(--color-fg));
  --pd-warn-fg: color-mix(in oklab, var(--color-warn) 80%, var(--color-fg));
  --pd-bad-fg: color-mix(in oklab, var(--color-bad) 80%, var(--color-fg));
  /* type scale */
  --pd-fs-table: calc((var(--cds-font-size-caption) + var(--cds-font-size-body)) / 2);
  --pd-fs-lead: calc(var(--cds-font-size-body) * 1.1);
  --pd-fs-sec: calc(var(--cds-font-size-heading) * 1.25);
  --pd-fs-big: calc(var(--cds-font-size-title) * 1.25);
  --pd-fs-hero: calc(var(--cds-font-size-title) * 2);
  --pd-fs-display: calc(var(--cds-font-size-title) * 1.7);
  --pd-sec-gap: 3rem;
  --pd-spring: cubic-bezier(0.34, 1.45, 0.64, 1);
  --pd-out: cubic-bezier(0.2, 0, 0, 1);
  container: pd / inline-size;
  font-family: var(--font-anthropic-sans);
  font-size: var(--cds-font-size-body);
  color: var(--color-fg);
  line-height: 1.5;
  max-width: 78rem;
  margin-inline: auto;
}
.pd *, .pd *::before, .pd *::after { box-sizing: border-box; }
.pd [hidden] { display: none !important; }
.pd [id] { scroll-margin-top: 5.5rem; }
.pd h1, .pd h2, .pd h3, .pd h4, .pd h5, .pd h6, .pd p, .pd ul, .pd ol, .pd dl, .pd dd { margin: 0; }
.pd button, .pd input { font: inherit; color: inherit; }
.pd button { cursor: pointer; }
.pd a { color: inherit; text-underline-offset: 3px; }
.pd :focus-visible { outline: 2px solid var(--color-fg); outline-offset: 2px; }
.pd .pd-dim { color: var(--color-fg-muted); }
.pd .pos { color: var(--color-ok); }
.pd .neg { color: var(--color-bad); }
.pd .pd-pre { white-space: pre-line; overflow-wrap: anywhere; }

/* ---- header and tab bar ---- */
.pd .pd-head { display: flex; flex-direction: column; gap: var(--pd-s1); padding: var(--pd-s3) 0 var(--pd-s2); }
.pd .pd-title { font-family: var(--font-anthropic-serif); font-weight: 400; font-size: var(--pd-fs-display); line-height: 1.08; letter-spacing: -0.02em; }
.pd .pd-takeaway { color: var(--color-fg-muted); font-size: var(--pd-fs-lead); line-height: 1.5; max-width: 64ch; min-height: 1.5em; }
.pd .pd-takeaway.pd-failed { display: flex; justify-content: flex-start; }
.pd .pd-navwrap { position: sticky; top: 0; z-index: 20; padding: var(--pd-s1) 0; margin-bottom: var(--pd-s3); background: color-mix(in oklab, var(--color-bg), transparent 14%); backdrop-filter: blur(12px); }
.pd .pd-tabs { position: relative; display: flex; gap: 4px; padding: 4px; width: fit-content; max-width: 100%; overflow-x: auto; scrollbar-width: none; border-radius: var(--pd-r-pill); background: var(--pd-t2); }
.pd .pd-tabs::-webkit-scrollbar { display: none; }
.pd .pd-tab { appearance: none; flex: none; border: 0; background: transparent; color: var(--color-fg-muted); font-weight: var(--cds-font-weight-medium); min-height: 48px; padding: 0 var(--pd-s3); border-radius: var(--pd-r-pill); white-space: nowrap; }
.pd .pd-tab:hover { color: var(--color-fg); background: color-mix(in oklab, var(--pd-t2), var(--color-fg) 8%); }
.pd .pd-tab[aria-selected="true"] { color: var(--color-fg); background: var(--pd-ac2); box-shadow: 0 1px 3px color-mix(in oklab, var(--color-fg), transparent 80%); }
.pd .pd-panel[hidden] { display: none; }
.pd .pd-stack { display: flex; flex-direction: column; gap: var(--pd-sec-gap); }
.pd .pd-sec { display: flex; flex-direction: column; gap: var(--pd-s2); min-width: 0; }
.pd .pd-sec-head { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--pd-s1) var(--pd-s3); flex-wrap: wrap; }
.pd .pd-sec-head > :first-child { flex: 1 1 22rem; min-width: 0; }
.pd .pd-sec-tools { display: flex; align-items: center; gap: var(--pd-s1); flex-wrap: wrap; }
.pd .pd-h2 { font-size: var(--pd-fs-sec); font-weight: var(--cds-font-weight-medium); line-height: 1.25; letter-spacing: -0.01em; }
.pd .pd-card-t { font-size: var(--cds-font-size-heading); font-weight: var(--cds-font-weight-medium); line-height: 1.3; margin-bottom: var(--pd-s1); }
.pd .pd-note.gap { margin: 0 0 var(--pd-s2); }
.pd .pd-card-t.flush { margin: 0; }
.pd .pd-card-t:not(:first-child) { margin-top: var(--pd-s3); }
.pd .pd-note { color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); line-height: 1.5; max-width: 72ch; margin-top: 4px; }
.pd .pd-foot { margin-top: var(--pd-s5); padding-top: var(--pd-s3); color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); max-width: 72ch; }

/* ---- surfaces ---- */
.pd .pd-card { background: var(--pd-t1); border-radius: var(--pd-r-card); padding: var(--pd-s2); min-width: 0; }
.pd .pd-card.accent { background: var(--pd-ac1); }
.pd .pd-card .pd-card { background: var(--pd-t2); border-radius: var(--pd-r-in); }
.pd .pd-box { min-height: 4rem; }
.pd .pd-empty { color: var(--color-fg-muted); padding: var(--pd-s1) 0; }
.pd .pd-failed { display: flex; align-items: center; justify-content: center; gap: 0.5rem; color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); }
.pd .pd-failed::before { content: ""; width: 0.375rem; height: 0.375rem; border-radius: 50%; background: var(--color-bad); flex: none; }

/* ---- controls ---- */
.pd .pd-btn { appearance: none; display: inline-flex; align-items: center; justify-content: center; gap: var(--pd-s1); min-height: 44px; padding: 0 var(--pd-s3); border: 0; border-radius: var(--pd-r-pill); background: var(--pd-t3); color: var(--color-fg); font-weight: var(--cds-font-weight-medium); }
.pd .pd-btn:hover { background: color-mix(in oklab, var(--pd-t3), var(--color-fg) 8%); }
.pd .pd-fchip { appearance: none; display: inline-flex; align-items: center; justify-content: center; gap: 0; min-height: 44px; padding: 0 var(--pd-s2); border: 0; border-radius: var(--pd-r-pill); background: var(--pd-t2); color: var(--color-fg); font-weight: var(--cds-font-weight-medium); }
.pd .pd-fchip::before { content: ""; width: 0; height: 0.6rem; margin-right: 0; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(45deg) translate(-1px, -2px); opacity: 0; }
.pd .pd-fchip:hover { background: color-mix(in oklab, var(--pd-t2), var(--color-fg) 8%); }
.pd .pd-fchip[aria-pressed="true"] { background: var(--pd-ac2); }
.pd .pd-fchip[aria-pressed="true"]::before { width: 0.35rem; margin-right: 0.6rem; opacity: 1; }
.pd .pd-seg { display: flex; gap: 4px; padding: 4px; border-radius: var(--pd-r-pill); background: var(--pd-t2); }
.pd .pd-segbtn { appearance: none; flex: 1; min-height: 44px; border: 0; border-radius: var(--pd-r-pill); background: transparent; color: var(--color-fg-muted); font-weight: var(--cds-font-weight-medium); }
.pd .pd-segbtn:hover { color: var(--color-fg); }
.pd .pd-segbtn[aria-pressed="true"] { background: var(--pd-ac2); color: var(--color-fg); box-shadow: 0 1px 3px color-mix(in oklab, var(--color-fg), transparent 80%); }
.pd .pd-textbtn { appearance: none; display: inline-flex; align-items: center; gap: 0.5rem; min-height: 44px; padding: 0 var(--pd-s2) 0 0; border: 0; background: transparent; color: var(--color-fg); font-weight: var(--cds-font-weight-medium); font-size: var(--cds-font-size-caption); text-decoration: underline; text-decoration-thickness: 2px; text-decoration-color: var(--pd-accent); text-underline-offset: 5px; }
.pd .pd-textbtn::after { content: ""; width: 0.4rem; height: 0.4rem; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(45deg) translate(-1px, -1px); flex: none; }
.pd .pd-textbtn[aria-expanded="true"]::after { transform: rotate(225deg) translate(-1px, -1px); }
.pd .pd-link { display: inline-flex; align-items: center; gap: 0.5rem; min-height: 44px; padding: 0 var(--pd-s2); border-radius: var(--pd-r-pill); background: var(--pd-t2); color: var(--color-fg); font-size: var(--cds-font-size-caption); font-weight: var(--cds-font-weight-medium); text-decoration: none; white-space: nowrap; }
.pd .pd-link::after { content: "\2197"; }
.pd .pd-link:hover { background: var(--pd-t3); }
.pd .pd-input { appearance: none; width: 100%; min-width: 0; min-height: 48px; padding: 0 var(--pd-s2); border: 0; border-radius: var(--pd-r-in); background: var(--pd-t2); box-shadow: inset 0 0 0 1px var(--pd-line); font-variant-numeric: tabular-nums; }
.pd .pd-input[type="search"] { border-radius: var(--pd-r-pill); padding: 0 var(--pd-s3); width: 16rem; max-width: 100%; }
.pd .pd-chip { display: inline-flex; align-items: center; gap: 6px; min-height: 1.75rem; padding: 0 0.75rem; border-radius: var(--pd-r-pill); background: var(--pd-t3); color: var(--color-fg); font-size: var(--cds-font-size-caption); font-weight: var(--cds-font-weight-medium); line-height: 1.2; white-space: nowrap; }
.pd .pd-chip.muted { background: var(--pd-t2); color: var(--color-fg-muted); }
.pd .pd-chip.ok { background: var(--pd-ok-bg); color: var(--pd-ok-fg); }
.pd .pd-chip.bad { background: var(--pd-bad-bg); color: var(--pd-bad-fg); }
.pd .pd-chip.warn { background: var(--pd-warn-bg); color: var(--pd-warn-fg); }
.pd .pd-chip.tag::before { content: ""; width: 0.5rem; height: 0.5rem; border-radius: 50%; background: var(--chip, var(--color-fg-muted)); flex: none; }

/* ---- show more / less ---- */
.pd .pd-clampbox { min-width: 0; display: flex; flex-direction: column; align-items: flex-start; }
.pd .pd-clamp { max-width: 100%; white-space: pre-line; overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: var(--lines, 3); overflow: hidden; }
.pd .pd-clampbox.open > .pd-clamp { display: block; -webkit-line-clamp: unset; overflow: visible; }
.pd .pd-clip { max-height: 28rem; overflow: hidden; position: relative; --pd-fade: var(--pd-t1); }
.pd .pd-clip.open { max-height: none; }
.pd .pd-clip.is-clipped:not(.open)::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 4.5rem; background: linear-gradient(to bottom, transparent, var(--pd-fade)); pointer-events: none; }
.pd .pd-clip + .pd-btn { margin-top: var(--pd-s2); }

/* ---- today: status band ---- */
.pd .pd-band { display: grid; grid-template-columns: 1fr 1fr; gap: var(--pd-s2) var(--pd-s3); align-items: stretch; background: var(--pd-ac1); border-radius: var(--pd-r-hero); padding: var(--pd-s3); }
.pd .pd-bandcell { appearance: none; border: 0; background: transparent; text-align: left; display: flex; flex-direction: column; gap: 4px; min-width: 0; padding: 0; border-radius: var(--pd-r-tile); }
.pd .pd-bc-regime, .pd .pd-bc-gate { grid-column: 1 / -1; }
.pd .pd-bc-setups { order: 2; }
.pd .pd-bc-regime { order: 3; }
.pd .pd-bc-gate { order: 4; }
.pd .pd-band-v { font-family: var(--font-anthropic-serif); font-weight: 400; font-size: var(--pd-fs-big); line-height: 1.15; font-variant-numeric: tabular-nums; }
.pd .pd-band-regime { font-size: var(--cds-font-size-heading); font-weight: var(--cds-font-weight-medium); line-height: 1.35; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; overflow-wrap: anywhere; }
.pd .pd-band-sub { color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); line-height: 1.4; }
.pd .pd-bc-gate { background: var(--pd-t1); padding: var(--pd-s2) var(--pd-s3); min-height: 5.5rem; justify-content: center; }
.pd .pd-bc-gate:hover { background: var(--pd-t2); }
.pd .pd-bc-gate[data-v="go"] { background: var(--pd-ok-bg); }
.pd .pd-bc-gate[data-v="go"] .pd-band-v { color: var(--pd-ok-fg); }
.pd .pd-bc-gate[data-v="skip"] { background: var(--pd-bad-bg); }
.pd .pd-bc-gate[data-v="skip"] .pd-band-v { color: var(--pd-bad-fg); }
.pd .pd-bc-setups.hot .pd-band-v { color: var(--color-fg); }
.pd .pd-bc-setups.hot .pd-band-v::after { content: ""; display: inline-block; width: 0.5rem; height: 0.5rem; margin-left: 0.5rem; border-radius: 50%; background: var(--pd-accent); vertical-align: middle; }

/* ---- figures ---- */
.pd .pd-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 12rem), 1fr)); gap: var(--pd-s2); }
.pd .pd-kpi { container-type: inline-size; background: var(--pd-t1); border-radius: var(--pd-r-tile); padding: var(--pd-s3); display: flex; flex-direction: column; gap: 4px; min-width: 0; min-height: 8rem; }
.pd .pd-kpi.hero { grid-column: 1 / -1; background: var(--pd-ac1); border-radius: var(--pd-r-hero); padding: var(--pd-s4); min-height: 0; gap: var(--pd-s1); }
.pd .pd-kpi.hot { background: var(--pd-ac1); }
.pd .pd-kpi-label { color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); line-height: 1.35; }
.pd .pd-kpi-value { font-family: var(--font-anthropic-serif); font-weight: 400; font-size: var(--pd-fs-big); line-height: 1.12; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.pd .pd-kpi.hero .pd-kpi-value { font-size: var(--pd-fs-hero); line-height: 1.05; letter-spacing: -0.02em; }
.pd .pd-kpi-sub { color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); line-height: 1.45; font-variant-numeric: tabular-nums; margin-top: auto; padding-top: 4px; max-width: 64ch; }
.pd .pd-kpi-sub .pos { color: var(--color-ok); }
.pd .pd-kpi-sub .neg { color: var(--color-bad); }
@container (max-width: 15rem) { .pd .pd-kpi-label { min-height: 2.7em; } }

/* ---- portfolio: attention strip, waiting ---- */
.pd .pd-attn { display: flex; align-items: center; gap: var(--pd-s1) var(--pd-s3); flex-wrap: wrap; background: var(--pd-t1); border-radius: var(--pd-r-hero); padding: var(--pd-s2) var(--pd-s3); }
.pd .pd-attn.warn { background: var(--pd-warn-bg); }
.pd .pd-attn-label { font-weight: var(--cds-font-weight-medium); }
.pd .pd-attn-items { display: flex; gap: var(--pd-s1); flex-wrap: wrap; flex: 1 1 18rem; min-height: 44px; align-items: center; }
.pd .pd-attn-item { appearance: none; display: inline-flex; align-items: center; gap: 0.5rem; min-height: 44px; padding: 0 var(--pd-s2); border: 0; border-radius: var(--pd-r-pill); background: color-mix(in oklab, var(--color-panel), transparent 25%); color: var(--color-fg); font-size: var(--cds-font-size-caption); font-weight: var(--cds-font-weight-medium); text-align: left; }
.pd .pd-attn-item:hover { background: var(--color-panel); }
.pd .pd-attn-n { font-family: var(--font-anthropic-serif); font-weight: 400; font-size: var(--cds-font-size-heading); font-variant-numeric: tabular-nums; }
.pd .pd-sublist { list-style: none; padding: 0; display: flex; flex-direction: column; gap: var(--pd-s2); margin-bottom: var(--pd-s3); }
.pd .pd-prop { background: var(--pd-t2); border-radius: var(--pd-r-in); padding: var(--pd-s2) var(--pd-s3); display: flex; flex-direction: column; gap: var(--pd-s1); }
.pd .pd-prop-h { display: flex; align-items: center; gap: var(--pd-s1); flex-wrap: wrap; }
.pd .pd-gaps { list-style: none; padding: 0; display: flex; flex-direction: column; gap: var(--pd-s1); max-width: 72ch; }
.pd .pd-gaps li { background: var(--pd-t2); border-radius: var(--pd-r-in); padding: var(--pd-s2) var(--pd-s3); }
.pd .pd-gap-n { font-family: var(--font-anthropic-serif); font-weight: 400; font-size: var(--cds-font-size-heading); font-variant-numeric: tabular-nums; }

/* ---- today: regime ---- */
.pd .pd-regime-main { display: flex; flex-direction: column; gap: var(--pd-s1); max-width: 72ch; }
.pd .pd-regime-top { display: flex; align-items: center; gap: var(--pd-s1); flex-wrap: wrap; color: var(--color-fg-muted); font-variant-numeric: tabular-nums; }
.pd .pd-regime-regime { font-size: var(--pd-fs-sec); font-weight: var(--cds-font-weight-medium); line-height: 1.3; letter-spacing: -0.01em; }
.pd .pd-regime-headline { color: var(--color-fg-muted); font-size: var(--pd-fs-lead); line-height: 1.5; }

/* ---- rendered Notion text ---- */
.pd .nr { overflow-wrap: anywhere; line-height: 1.55; }
.pd .nr :is(h3, h4, h5, h6) { line-height: 1.25; }
.pd .nr .nr-h1 { font-family: var(--font-anthropic-serif); font-weight: 400; font-size: var(--pd-fs-big); letter-spacing: -0.01em; margin: 2.2em 0 0.5em; }
.pd .nr .nr-h2 { font-family: var(--font-anthropic-serif); font-weight: 400; font-size: calc(var(--cds-font-size-title) * 1.05); letter-spacing: -0.01em; margin: 2em 0 0.5em; }
.pd .nr .nr-h3 { font-size: var(--cds-font-size-heading); font-weight: var(--cds-font-weight-medium); margin: 1.6em 0 0.4em; }
.pd .nr .nr-h4 { font-size: var(--cds-font-size-body); font-weight: var(--cds-font-weight-medium); color: var(--color-fg-muted); margin: 1.3em 0 0.3em; }
.pd .nr p { margin: 0.6em 0; }
.pd .nr ul, .pd .nr ol { margin: 0.5em 0; padding-left: 1.4em; }
.pd .nr li { margin: 0.35em 0; padding-left: 0.2em; }
.pd .nr li::marker { color: var(--color-fg-muted); }
.pd .nr li > :is(ul, ol) { margin: 0.3em 0; }
.pd .nr li > p { margin: 0.35em 0; }
.pd .nr .nr-task { list-style: none; margin-left: -1.2em; }
.pd .nr hr { border: 0; height: 1px; background: var(--pd-line); margin: 2em 0; }
.pd .nr blockquote { margin: 0.9em 0; padding: 0.1em 0 0.1em 1em; border-left: 4px solid color-mix(in oklab, var(--pd-accent), transparent 50%); color: var(--color-fg-muted); }
.pd .nr blockquote p { margin: 0.3em 0; }
.pd .nr code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.9em; background: var(--pd-t3); padding: 0.1em 0.4em; border-radius: 6px; }
.pd .nr .nr-pre { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: var(--cds-font-size-caption); line-height: 1.5; background: var(--pd-t2); padding: var(--pd-s2) var(--pd-s3); border-radius: var(--pd-r-in); overflow-x: auto; white-space: pre; margin: 1em 0; }
.pd .nr strong { font-weight: 600; }
.pd .nr > :first-child:is(h3, h4, h5, h6, p, ul, ol, hr, div, blockquote, pre, details) { margin-top: 0; }
.pd .nr > :is(p, ul, ol, blockquote, h3, h4, h5, h6, .nr-callout, .nr-details) { max-width: 72ch; }
.pd .nr .nr-callout { background: var(--pd-t2); border-radius: var(--pd-r-in); padding: var(--pd-s1) var(--pd-s3); margin: 1.1em 0; }
.pd .nr .nr-callout.tone-acc { background: var(--pd-ac1); }
.pd .nr .nr-callout.tone-ok { background: var(--pd-ok-bg); }
.pd .nr .nr-callout.tone-warn { background: var(--pd-warn-bg); }
.pd .nr .nr-callout.tone-bad { background: var(--pd-bad-bg); }
.pd .nr .nr-details { background: var(--pd-t2); border-radius: var(--pd-r-in); padding: 0 var(--pd-s3); margin: 0.9em 0; }
.pd .nr .nr-details[open] { padding-bottom: var(--pd-s1); }
.pd .nr summary, .pd .nr .nr-summary { cursor: pointer; font-weight: var(--cds-font-weight-medium); min-height: 48px; display: flex; align-items: center; justify-content: space-between; gap: var(--pd-s2); list-style: none; }
.pd .nr summary::-webkit-details-marker { display: none; }
.pd .nr summary::after { content: ""; width: 0.45rem; height: 0.45rem; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(45deg); flex: none; }
.pd .nr details[open] > summary::after { transform: rotate(225deg); }

<script>
/* ===== Loaders: Notion answers become rows ===== */
const joinPages = async ({ answer, call, args }) => {
  const parse = (x) => {
    if (typeof x !== 'string') return x;
    try { return JSON.parse(x); } catch (e) { throw new Error(x.slice(0, 400)); }
  };
  let a = parse(answer);
  const rows = [];
  let extra = 0;
  for (;;) {
    if (!a || !Array.isArray(a.results)) {
      const m = a && (a.message || a.error || a.text);
      throw new Error(typeof m === 'string' ? m : 'Notion returned no results' + (a && typeof a === 'object' ? ' (keys: ' + Object.keys(a).join(', ') + ')' : ''));
    }
    rows.push(...a.results);
    if (!(a.has_more && a.next_cursor) || extra >= 5) break;
    extra++;
    a = parse(await call('notion-query-data-sources', { data: { ...args.data, start_cursor: a.next_cursor } }));
  }
  const columns = [];
  for (const r of rows) for (const k of Object.keys(r)) if (!columns.includes(k)) columns.push(k);
  return { data: rows, columns, cut: !!a.has_more };
};
['portfolio', 'ledger', 'lab', 'pulse'].forEach((id) => {
  dash.loader(id, { description: 'Notion returns 100 rows a page; this joins the pages.', fn: joinPages });
});

dash.loader('latest_pulse', {
  description: 'Finds the newest pre-market pulse and reads its page.',
  fn: async ({ answer, call, args }) => {
    const parse = (x) => {
      if (typeof x !== 'string') return x;
      try { return JSON.parse(x); } catch (e) { throw new Error(x.slice(0, 400)); }
    };
    let a = parse(answer);
    const rows = [];
    let extra = 0;
    for (;;) {
      if (!a || !Array.isArray(a.results)) {
        const m = a && (a.message || a.error || a.text);
        throw new Error(typeof m === 'string' ? m : 'Notion returned no results' + (a && typeof a === 'object' ? ' (keys: ' + Object.keys(a).join(', ') + ')' : ''));
      }
      rows.push(...a.results);
      if (!(a.has_more && a.next_cursor) || extra >= 5) break;
      extra++;
      a = parse(await call('notion-query-data-sources', { data: { ...args.data, start_cursor: a.next_cursor } }));
    }
    const pre = rows.filter((r) => r.Type === 'Pre-market pulse');
    if (!pre.length) return [];
    const day = (r) => String(r['date:Date:start'] || '');
    let best = pre[0];
    for (const r of pre.slice(1)) {
      if (day(r) > day(best) || (day(r) === day(best) && String(r.createdTime || '') > String(best.createdTime || ''))) best = r;
    }
    let page = await call('notion-fetch', { id: best.url });
    if (typeof page === 'string') {
      try { const p = JSON.parse(page); if (p && typeof p === 'object') page = p; } catch (e) { /* plain text page */ }
    }
    const text = typeof page === 'string' ? page : page && page.text;
    if (typeof text !== 'string') {
      const m = page && (page.message || page.error);
      throw new Error(typeof m === 'string' ? m : 'The pulse page came back without text');
    }
    const i = text.indexOf('<content>');
    const j = text.lastIndexOf('</content>');
    const body = (i >= 0 && j > i ? text.slice(i + 9, j) : text).trim();
    return [{
      Title: best.Title,
      Date: best['date:Date:start'],
      Headline: best.Headline,
      Regime: best.Regime,
      'Setups proposed': best['Setups proposed'],
      url: best.url,
      Body: body,
    }];
  },
});

dash.loader('collateral', {
  description: 'Reads the Collateral and Stress Test page body.',
  fn: ({ answer }) => {
    let a = answer;
    if (typeof a === 'string') {
      try { const p = JSON.parse(a); if (p && typeof p === 'object') a = p; } catch (e) { throw new Error(a.slice(0, 400)); }
    }
    if (!a || typeof a.text !== 'string') {
      const m = a && (a.message || a.error);
      throw new Error(typeof m === 'string' ? m : 'The page came back without text');
    }
    const i = a.text.indexOf('<content>');
    const j = a.text.lastIndexOf('</content>');
    const body = (i >= 0 && j > i ? a.text.slice(i + 9, j) : a.text).trim();
    return [{ Title: a.title, url: a.url, Body: body }];
  },
});

dash.loader('brain_index', {
  description: 'Lists the child pages of the Brain index page, in page order.',
  fn: ({ answer }) => {
    let a = answer;
    if (typeof a === 'string') {
      try { const p = JSON.parse(a); if (p && typeof p === 'object') a = p; } catch (e) { a = { text: a }; }
    }
    if (!a || typeof a.text !== 'string' || !a.text) {

    const i = a.text.indexOf('<content>');
    const j = a.text.lastIndexOf('</content>');
    const text = i >= 0 && j > i ? a.text.slice(i + 9, j) : a.text;
    const lead = /^[\s‍️⃣\p{Extended_Pictographic}\p{Emoji_Modifier}\u{1F1E6}-\u{1F1FF}]+/u;
    const ents = { '&amp;': '&', '&lt;': '<', '&gt;': '>', '&quot;': '"', '&#39;': "'" };

dash.calc('by_theme', {

dash.calc('setup_stats', {

/* ---- today: day gate (rules are the owner's constants) ---- */
function initGate() {
  const readNum = (id) => { const v = $(id).value.trim(); return v === '' || !isFinite(Number(v)) ? null : Number(v); };
  const flag = (id) => $(id).getAttribute('aria-pressed') === 'true';
  const fmt = (n) => String(Math.round(n * 100) / 100);
  function gate() {
    const gap = readNum('gate-gap'), vix = readNum('gate-vix'), mv = readNum('gate-vixmove');
    const ev = flag('gate-event'), dv = flag('gate-diverge');
    const why = [];
    if (gap !== null && Math.abs(gap) > RULES.gap) why.push('Opening gap of ' + fmt(gap) + '% is beyond ±' + RULES.gap.toFixed(2) + '%.');
    if (mv !== null && Math.abs(mv) > RULES.vixMove) why.push('VIX moved ' + fmt(mv) + '% today, beyond ±' + RULES.vixMove + '%.');
    if (ev) why.push('A high-impact event falls inside 09:15–14:30.');
    if (dv) why.push('Heavyweights are diverging.');
    const any = gap !== null || vix !== null || mv !== null || ev || dv;
    const v = why.length ? 'skip' : any ? 'go' : 'wait';
    $('gate-verdict').dataset.v = v;
    $('gate-word').textContent = v === 'skip' ? 'SKIP' : v === 'go' ? 'GO' : 'Enter the opening numbers';
    $('gate-why').replaceChildren(...why.map((t) => el('li', null, t)));
    $('band-gate').dataset.v = v;
    $('band-gate-word').textContent = v === 'skip' ? 'SKIP' : v === 'go' ? 'GO' : 'Not checked';
    $('band-gate-s').textContent = v === 'skip' ? 'A skip rule is triggered' : v === 'go' ? 'No skip rule is triggered' : 'Enter the opening numbers below';
    const note = $('gate-vixnote');
    let t = '';
    if (vix !== null) {
      if (vix < RULES.vixLow) t = 'chop and false-breakout risk';
      else if (vix < RULES.vixMidLo) t = 'between the chop and momentum bands, no clear read';
      else if (vix <= RULES.vixMidHi) t = 'momentum range';
      else if (vix <= RULES.vixHigh) t = 'between the momentum and whipsaw bands, no clear read';
      else t = 'whipsaw risk: cut size or skip';
      t = 'VIX at ' + fmt(vix) + ': ' + t + '.';
    }
    note.hidden = !t;
    note.textContent = t;
  }
  ['gate-gap', 'gate-vix', 'gate-vixmove'].forEach((id) => $(id).addEventListener('input', gate));
  ['gate-event', 'gate-diverge'].forEach((id) => $(id).addEventListener('click', () => {
    $(id).setAttribute('aria-pressed', String(!flag(id)));
    gate();
  }));
  $('band-gate').addEventListener('click', () => go('day-gate'));

  let dir = 'Long';
  function size() {
    const risk = readNum('size-risk'), entry = readNum('size-entry'), stop = readNum('size-stop');
    const sign = dir === 'Long' ? 1 : -1;
    const sg = sign > 0 ? '+' : MINUS;
    $('size-t1-l').textContent = 'T1, book half (' + sg + RULES.t1.toFixed(2) + '%)';
    $('size-t2-l').textContent = 'T2, trail to cost (' + sg + RULES.t2.toFixed(2) + '%)';
    const out = ['size-qty', 'size-val', 'size-loss', 'size-t1', 'size-t2'];
    const warn = $('size-warn');
    const reset = (msg) => { out.forEach((id) => { $(id).textContent = '—'; }); warn.hidden = !msg; warn.textContent = msg || ''; };
    if (risk === null || entry === null || stop === null) { reset(''); return; }
    if (entry <= 0 || stop <= 0 || risk <= 0) { reset('Risk, entry and stop must be above zero.'); return; }
    if (entry === stop) { reset('Entry and stop are the same price.'); return; }
    if ((dir === 'Long' && stop > entry) || (dir === 'Short' && stop < entry)) {
      reset('The stop is on the wrong side of entry for a ' + dir.toLowerCase() + '. A ' + dir.toLowerCase() + ' needs the stop ' + (dir === 'Long' ? 'below' : 'above') + ' entry.');
      return;
    }
    const dist = Math.abs(entry - stop);
    const qty = Math.floor(risk / dist);
    warn.hidden = qty > 0;
    warn.textContent = qty > 0 ? '' : 'Risk is too small for one share at this stop distance.';
    $('size-qty').textContent = F.in0.format(qty);
    $('size-val').textContent = inr(qty * entry, 'f');
    $('size-loss').textContent = inr(qty * dist, 'f');
    $('size-t1').textContent = inr(entry * (1 + sign * RULES.t1 / 100), 'p');
    $('size-t2').textContent = inr(entry * (1 + sign * RULES.t2 / 100), 'p');
  }
  ['size-risk', 'size-entry', 'size-stop'].forEach((id) => $(id).addEventListener('input', size));
  const setDir = (d) => {
    dir = d;
    $('size-long').setAttribute('aria-pressed', String(d === 'Long'));
    $('size-short').setAttribute('aria-pressed', String(d === 'Short'));
    size();
  };
  $('size-long').addEventListener('click', () => setDir('Long'));
  $('size-short').addEventListener('click', () => setDir('Short'));
  gate();
  size();
}

/* ---- portfolio: theme bars ---- */
function drawThemes(box, data) {
  box.replaceChildren();
  const W = Math.floor(box.clientWidth);
  if (W < 60) return;
  const accent = dash.colors[0];
  const svg = d3.select(box).append('svg').attr('width', '100%').attr('role', 'img').attr('aria-label', 'Bar chart of portfolio value by theme');
  const measure = (txt, cls) => { const t = svg.append('text').attr('class', 'pd-ct ' + (cls || '')).text(txt); const w = t.node().getComputedTextLength(); t.remove(); return w; };
  const endTxt = (d) => inr(d.value_inr) + ' · ' + pct(d.share, 1);
  const endW = d3.max(data, (d) => measure(endTxt(d), 'v'));
  let labelW = Math.min(d3.max(data, (d) => measure(d.Theme)), W * 0.36);
  const stacked = W < 480 || W - labelW - 12 - endW - 8 < 90;
  if (stacked) labelW = 0;
  const x0 = stacked ? 0 : labelW + 12;
  const barMax = stacked ? W : W - x0 - endW - 8;
  const sx = d3.scaleLinear([0, d3.max(data, (d) => d.value_inr) || 1], [0, barMax]);
  const rowH = stacked ? 56 : 44, barH = stacked ? 12 : 16, pad = 4;
  const H = pad * 2 + data.length * rowH;
  svg.attr('viewBox', '0 0 ' + W + ' ' + H).attr('height', H);
  const tip = makeTip(box);
  const fit = (sel, label, maxW) => {
    let s = label;
    sel.text(s);
    while (sel.node().getComputedTextLength() > maxW && s.length > 1) { s = s.slice(0, -1); sel.text(s.trimEnd() + '…'); }
  };
  const lines = (d) => [['Value', inr(d.value_inr, 'f')], ['Share', pct(d.share, 1)], ['Holdings', cnt(d.positions)]];
  data.forEach((d, i) => {
    const y = pad + i * rowH;
    const w = Math.max(2, sx(d.value_inr));
    const g = svg.append('g').attr('class', 'pd-row').attr('tabindex', 0).attr('aria-label', d.Theme + ': ' + endTxt(d));
    g.append('rect').attr('class', 'pd-hit').attr('x', 0).attr('y', y).attr('width', W).attr('height', rowH).attr('rx', 12);
    const fill = i === 0 ? accent : 'var(--cds-chart-muted)';
    if (stacked) {
      fit(g.append('text').attr('class', 'pd-ct').attr('x', 0).attr('y', y + 20), d.Theme, W - endW - 12);
      g.append('text').attr('class', 'pd-ct v').attr('x', W).attr('y', y + 20).attr('text-anchor', 'end').text(endTxt(d));
      g.append('rect').attr('x', 0).attr('y', y + 30).attr('width', w).attr('height', barH).attr('rx', barH / 2).style('fill', fill);
    } else {
      fit(g.append('text').attr('class', 'pd-ct').attr('x', 0).attr('y', y + rowH / 2).attr('dy', '0.35em'), d.Theme, labelW);
      g.append('rect').attr('x', x0).attr('y', y + (rowH - barH) / 2).attr('width', w).attr('height', barH).attr('rx', barH / 2).style('fill', fill);
      g.append('text').attr('class', 'pd-ct v').attr('x', x0 + w + 8).attr('y', y + rowH / 2).attr('dy', '0.35em').text(endTxt(d));
    }
    g.on('pointermove', (e) => { const b = box.getBoundingClientRect(); tip.show(d.Theme, lines(d), e.clientX - b.left, e.clientY - b.top); })
      .on('pointerleave', () => tip.hide())
      .on('focus', () => tip.show(d.Theme, lines(d), Math.min(W - 20, x0 + w), y + rowH / 2))
      .on('blur', () => tip.hide());
  });
}

function proposalOf(notes) {
  const s = String(notes || '').replace(/\r/g, '');
  const i = s.indexOf('PROPOSED (');
  if (i < 0) return null;
  let rest = s.slice(i);
  const dbl = /<br\s*\/?>\s*<br\s*\/?>|\n\s*\n/i.exec(rest);
  if (dbl) rest = rest.slice(0, dbl.index);
  else { const one = /<br\s*\/?>|\n/i.exec(rest); if (one) rest = rest.slice(0, one.index); }
  return clean(rest);
}
function proposedLabel(text, current) {
  const body = text.replace(/^PROPOSED \([^)]*\):?/, '');
  const find = (skip) => {
    let best = null;
    for (const c of CLASSES) {
      const i = body.indexOf(c);
      if (i >= 0 && !(skip && c === current) && (best === null || i < best.i)) best = { c, i };
    }
    return best;
  };
  const b = find(true) || find(false);
  return b ? b.c : null;
}

  }
  const note = $('stats-note');
  note.replaceChildren();
  if (ok) {
    const n = ms(whole(s.scored), 'setup_stats', 'scored', 0);
    if (s.scored < SCORED_MIN) note.append('Too few scored setups to judge any edge yet (n = ', n, ').');
    else note.append('Average theoretical R is measured on ', n, ' scored setups. It describes what was frozen, not what comes next.');
  }
}
const rCell = (f) => (td, r) => { const v = num(r[f]); if (v === null) { dim(td); return; } td.textContent = rfmt(v); td.classList.add(sgn(v)); };
const firstSentence = (t) => { const m = /^[\s\S]*?[.!?](?=\s|$)/.exec(t); return m ? m[0] : t; };
const LCOLS = [
  C('Setup ID', 'Setup', { stick: true }),
  C('date:Frozen at:start', 'Frozen (IST)', { first: 'desc', cell: (td, r) => { const s = r['date:Frozen at:start']; if (s) td.textContent = dayTimeStr(s); else dim(td); } }),
  C('Instrument', 'Instrument', { sort: (r) => clean(r.Instrument), cell: (td, r) => { const full = clean(r.Instrument); clampCell(td, full, 2, 'ledger:' + r['Setup ID'], firstSentence(full)); } }),
  C('Direction', 'Direction', { cell: chipCell('Direction', (v) => (v === 'Long' ? 'ok' : v === 'Short' ? 'bad' : 'muted')) }),
  C('Horizon', 'Horizon'),
  C('Setup family', 'Setup family'),
  C('Status', 'Status', { cell: chipCell('Status', () => 'muted') }),
  C('POST Trigger occurred', 'Trigger occurred'),
  C('POST Outcome', 'Outcome'),
  C('POST Theoretical R', 'Theoretical R', { num: true, sort: (r) => num(r['POST Theoretical R']), cell: rCell('POST Theoretical R') }),
  C('Data quality', 'Data quality', { cell: (td, r) => { const v = clean(r['Data quality']); if (!v) { dim(td); return; } td.textContent = v; if (v !== 'Full') td.style.color = 'var(--color-warn)'; } }),
];
const RCOLS = [
  C('Name', 'Name', { stick: true, cell: (td, r) => { td.textContent = r.Name; td.classList.add('wrapc'); } }),
  C('date:Date:start', 'Date', { first: 'desc', cell: (td, r) => { if (r['date:Date:start']) td.textContent = dayStr(r['date:Date:start']); else dim(td); } }),
  C('Rejection reason', 'Rejection reason', { sort: (r) => clean(r['Rejection reason']), cell: (td, r) => clampCell(td, clean(r['Rejection reason']), 2, 'rej:r:' + r.Name) }),
  C('Subsequent price behaviour', 'Subsequent price behaviour', {
    sort: (r) => clean(r['Subsequent price behaviour']),
    cell: (td, r) => {
      const v = clean(r['Subsequent price behaviour']);
      if (v) clampCell(td, v, 2, 'rej:s:' + r.Name);
      else { td.textContent = 'Not scored yet'; td.classList.add('pd-dim'); }
    },
  }),
];
let LT = null, RT = null;
function detailBlock(label, row, field, src, w, none, key) {
  const b = el('div', 'pd-blk');
  const full = clean(row[field]);
  b.append(el('div', 'pd-blk-l', label));
  if (full) b.append(clampBox(full, 6, key, { cls: 'pd-blk-v', mark: (t) => markIf(t, row[field], src, field, w) }));
  else b.append(el('div', 'pd-blk-v pd-dim', none));
  return b;
}
function renderLedgerDetail() {
  const box = $('ledger-detail');
  box.replaceChildren();
  const r = rowsOf('ledger').find((x) => x['Setup ID'] === SEL.setup);
  if (!r) { box.append(empty('Select a setup above to read its thesis, trigger and lessons.')); return; }
  const w = { 'Setup ID': r['Setup ID'] };
  const head = el('div', 'pd-setup-head');
  head.append(mark(el('strong', 'pd-setup-id', r['Setup ID']), 'ledger', 'Setup ID', w));
  if (clean(r.Instrument)) head.append(el('span', 'pd-setup-meta', firstSentence(clean(r.Instrument))));
  box.append(head);
  [['Thesis', 'PRE Thesis', 'Not recorded.'], ['Trigger', 'PRE Trigger', 'Not recorded.'], ['Lessons', 'POST Lessons', 'No lessons recorded yet.']].forEach(([label, f, none]) => {
    box.append(detailBlock(label, r, f, 'ledger', w, none, 'ldet:' + r['Setup ID'] + ':' + f));
  });
}
function renderLedger() {
  if (!LT) return;
  if (!tableGate($('ledger-state'), $('ledger-wrap'), stOf('ledger'))) { $('ledger-detail').replaceChildren(); return; }
  const list = rowsOf('ledger');
  if (!list.length) {
    $('ledger-wrap').hidden = true;
    const s = $('ledger-state'); s.hidden = false; s.replaceChildren(empty('No setups have been frozen yet.'));
    $('ledger-detail').replaceChildren();

  renderLedgerDetail();
}
function stageOf(r) { return r.Stage || 'Hypothesis'; }
function hcard(r) {
  const w = { Name: r.Name };
  const b = el('button', 'pd-hcard');
  b.type = 'button';
  b.dataset.name = r.Name;
  b.setAttribute('aria-pressed', String(SEL.hyp === r.Name));
  b.append(mark(el('span', 'pd-hcard-n', r.Name), 'lab', 'Name', w));
  const m = el('span', 'pd-hcard-m');
  const nSize = num(r['Sample size']), nWins = num(r.Wins);
  m.append('n = ', nSize === null ? '—' : mark(el('span', null, cnt(nSize)), 'lab', 'Sample size', w), ' · wins = ', nWins === null ? '—' : mark(el('span', null, cnt(nWins)), 'lab', 'Wins', w));
  b.append(m);
  const ex = num(r['Expectancy R']);
  if (ex !== null) { const e = el('span', 'pd-hcard-m'); e.append('Expectancy ', mark(el('span', sgn(ex)), 'lab', 'Expectancy R', w)); e.lastChild.textContent = rfmt(ex); b.append(e); }
  if (r['date:Date:start']) b.append(mark(el('span', 'pd-hcard-m', dayStr(r['date:Date:start'])), 'lab', 'date:Date:start', w));
  b.addEventListener('click', () => {
    SEL.hyp = r.Name;
    $('pipe-board').querySelectorAll('.pd-hcard').forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.name === r.Name)));
    renderHypDetail();
    measureClamps();
  });
  return b;
}
function renderHypDetail() {
  const box = $('pipe-detail');
  box.replaceChildren();
  const r = rowsOf('lab').find((x) => x.Type === 'Strategy hypothesis' && x.Name === SEL.hyp);
  if (!r) { box.append(empty('Select a hypothesis above to read its statement, evidence and decision log.')); return; }
  const w = { Name: r.Name };
  const head = el('div', 'pd-setup-head');
  head.append(mark(el('strong', 'pd-setup-id', r.Name), 'lab', 'Name', w), mark(chip(stageOf(r), 'muted'), 'lab', 'Stage', w));
  box.append(head);
  [['Statement', 'Statement'], ['Evidence so far', 'Evidence so far'], ['Decision log', 'Decision log']].forEach(([label, f]) => {
    box.append(detailBlock(label, r, f, 'lab', w, 'Nothing recorded yet.', 'hdet:' + r.Name + ':' + f));
  });
}
function renderPipeline() {
  const box = $('pipe-board');
  if (!gateBox(box, stOf('lab', 'lab_stages'))) { $('pipe-detail').replaceChildren(); return; }
  const stages = rowsOf('lab_stages');
  const hyp = rowsOf('lab').filter((r) => r.Type === 'Strategy hypothesis');
  box.replaceChildren(...stages.map((s) => {
    const col = el('div', 'pd-col');
    const h = el('div', 'pd-col-head');
    h.append(mark(el('span', null, s.Stage), 'lab_stages', 'Stage', { Stage: s.Stage }), mark(el('span', 'n', cnt(s.n)), 'lab_stages', 'n', { Stage: s.Stage }));
    col.append(h);
    const cards = hyp.filter((r) => stageOf(r) === s.Stage).sort((a, b) => cmp(a['date:Date:start'], b['date:Date:start'], 'desc'));
    if (!cards.length) col.append(el('p', 'pd-note', 'None'));
    cards.forEach((r) => col.append(hcard(r)));
    return col;
  }));
  renderHypDetail();
}
function renderRejected() {
  if (!RT) return;
  if (!tableGate($('rej-state'), $('rej-wrap'), stOf('lab'))) return;
  const list = rowsOf('lab').filter((r) => r.Type === 'Rejected trade');
  if (!list.length) {
    $('rej-wrap').hidden = true;
    const s = $('rej-state'); s.hidden = false; s.replaceChildren(empty('No rejected trades logged yet.'));
    return;
  }
  RT.paint(list);
}
INIT.research = () => {
  LT = makeTable($('ledger-table'), LCOLS, {
    sort: ['date:Frozen at:start', 'desc'], key: 'Setup ID', redraw: renderLedger,
    onRow: (tr, r) => {
      const id = r['Setup ID'];
      tr.tabIndex = 0;
      if (SEL.setup === id) tr.classList.add('sel');
      const pick = () => {
        SEL.setup = id;
        $('ledger-table').querySelectorAll('tbody tr').forEach((x) => x.classList.toggle('sel', x.dataset.key === id));
        renderLedgerDetail();
        measureClamps();
      };
      tr.addEventListener('click', (e) => { if (!e.target.closest('.pd-clampbox')) pick(); });
      tr.addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target === tr) { e.preventDefault(); pick(); } });
    },
  });
  RT = makeTable($('rej-table'), RCOLS, { sort: ['date:Date:start', 'desc'], key: 'Name', redraw: renderRejected });
};

/* ---- log ---- */
const LOGF = { f: 'all', n: 30 };
function logItem(r) {
  const w = { Title: r.Title };
  const li = el('li', 'pd-log-item');
  li.style.setProperty('--chip', dash.colors[LOG_TYPES[r.Type] !== undefined ? LOG_TYPES[r.Type] : 0]);
  const top = el('div', 'pd-log-top');
  top.append(mark(el('span', null, dayStr(r['date:Date:start'])), 'pulse', 'date:Date:start', w));
  if (r.Type) top.append(mark(chip(r.Type, 'tag'), 'pulse', 'Type', w));
  const u = safeUrl(r.url);
  if (u) {
    const a = el('a', 'pd-link', 'Open');
    a.href = u; a.target = '_blank'; a.rel = 'noopener';
    a.setAttribute('aria-label', 'Open ' + (clean(r.Title) || 'entry') + ' in Notion');
    top.append(a);
  }
  li.append(top);
  li.append(fillText(el('div', 'pd-log-title'), r.Title, 'pulse', 'Title', w));
  if (clean(r.Headline)) li.append(fillText(el('div', 'pd-log-headline'), r.Headline, 'pulse', 'Headline', w));
  const reg = clean(r.Regime);
  if (reg) {
    const d = el('div', 'pd-log-regime');
    d.append(clampBox(reg, 2, 'log:' + r.Title, { mark: (t) => markIf(t, r.Regime, 'pulse', 'Regime', w) }));
    li.append(d);
  }
  return li;
}
function renderLog() {
  const box = $('log-list'), more = $('log-more');
  if (!gateBox(box, stOf('pulse'))) { more.hidden = true; return; }
  const all = rowsOf('pulse').filter((r) => LOGF.f === 'all' || r.Type === LOGF.f);
  all.sort((a, b) => cmp(a['date:Date:start'], b['date:Date:start'], 'desc')
    || cmp(LOG_PRI[a.Type] === undefined ? 9 : LOG_PRI[a.Type], LOG_PRI[b.Type] === undefined ? 9 : LOG_PRI[b.Type], 'asc')
    || cmp(a.Title, b.Title, 'asc'));
  if (!all.length) { box.replaceChildren(empty('Nothing logged yet.')); more.hidden = true; return; }
  const ol = el('ol', 'pd-log');
  ol.append(...all.slice(0, LOGF.n).map(logItem));
  box.replaceChildren(ol);
  more.hidden = all.length <= LOGF.n;
}
INIT.log = () => {
  $('log-filter').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-f]');
    if (!b) return;
    LOGF.f = b.dataset.f;
    LOGF.n = 30;
    $('log-filter').querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    renderLog();
    measureClamps();
  });
  $('log-more').addEventListener('click', () => { LOGF.n += 30; renderLog(); measureClamps(); });
};

/* ---- brain ---- */
let lastRail = '';
function renderRail(sel) {
  const box = $('brain-list');
  if (!gateBox(box, stOf('brain_index'))) return;
  const rows = rowsOf('brain_index');
  if (!rows.length) { SIG[box.id] = null; box.replaceChildren(empty('No Brain pages were found.')); return; }
  once(box.id, JSON.stringify(rows), () => {
    box.replaceChildren(...rows.map((r) => {
      const b = el('button', 'pd-rail-item');
      b.type = 'button';
      b.dataset.url = r.url;
      b.dataset.id = idOfUrl(r.url);
      b.append(mark(el('span', null, r.Title), 'brain_index', 'Title', { Title: r.Title }));
      return b;
    }));
  });
  let curBtn = null;
  box.querySelectorAll('.pd-rail-item').forEach((b) => {
    const on = !!sel && b.dataset.id === sel;
    if (on) { b.setAttribute('aria-current', 'page'); curBtn = b; } else b.removeAttribute('aria-current');
  });
  if (curBtn && lastRail !== sel && box.scrollWidth > box.clientWidth + 2 && getComputedStyle(box).flexDirection === 'row') {
    box.scrollTo({ left: Math.max(0, curBtn.offsetLeft - (box.clientWidth - curBtn.offsetWidth) / 2), behavior: REDUCED() ? 'auto' : 'smooth' });
  }
  lastRail = sel;
}
function renderArticle(sel) {
  const art = $('brain-main'), box = $('brain-body'), head = $('brain-title'), link = $('brain-open'), toc = $('brain-toc');
  const st = stOf('brain_page');
  const d = dash.data('brain_page');
  const idx = rowsOf('brain_index').find((x) => idOfUrl(x.url) === sel);
  const r = st === 'ok' ? oneOf('brain_page') : null;
  const stale = !!(r && sel && idOfUrl(r.url) !== sel);
  art.setAttribute('aria-busy', String(st === 'loading' || (st === 'ok' && (!!d.refreshing || stale))));
  head.replaceChildren();
  const titled = (row, src, loc) => {
    const span = el('span');
    if (clean(row.Title)) fillText(span, row.Title, src, 'Title', loc); else span.textContent = 'Untitled';
    head.append(span);
  };
  if (r && !stale) titled(r, 'brain_page', 0);
  else if (idx) titled(idx, 'brain_index', { Title: idx.Title });
  else if (r) titled(r, 'brain_page', 0);
  const u = r && !stale ? safeUrl(r.url) : idx ? safeUrl(idx.url) : null;
  link.hidden = !u;
  if (u) link.href = u;
  if (!gateBox(box, st)) { toc.hidden = true; return; }
  if (!r || !r.Body) {
    SIG[box.id] = null;
    toc.hidden = true;
    box.replaceChildren(empty(r ? 'This page has no text yet.' : 'Choose a page from the list.'));
    return;
  }
  once(box.id, String(r.Body), () => renderNotion(box, String(r.Body), { scope: 'brain', toc }));
}
function renderBrain() {
  const sel = idOfUrl((dash.params() || {}).brain_page);
  renderRail(sel);
  renderArticle(sel);
}
function revealArticle() {
  const a = $('brain-main');
  if (a && a.getBoundingClientRect().top < 72) a.scrollIntoView({ behavior: 'auto', block: 'start' });
}
INIT.brain = () => {
  $('brain-list').addEventListener('click', (e) => {
    const b = e.target.closest('.pd-rail-item');
    if (!b) return;
    dash.setParams({ brain_page: b.dataset.url });
    dash.setLink('brain');
    revealArticle();
    render();
  });
  $('brain-toc').addEventListener('click', (e) => {
    const b = e.target.closest('.pd-toc-link');
    if (b) jump(b.dataset.target);
  });
};

/* ---- draw everything the open tab needs ---- */
function render() {
  safe(renderHeader);
  if (active === 'today') { safe(renderBand); safe(renderRegime); safe(renderPulse); safe(renderOpenSetups); }
  else if (active === 'portfolio') {
    safe(renderAttn); safe(renderKpis); safe(renderThemes); safe(renderWaiting); safe(renderHoldings); safe(renderWatch); safe(renderCollateral);
  } else if (active === 'research') {
    safe(renderStats); safe(renderLedger); safe(renderPipeline); safe(renderRejected);
  } else if (active === 'log') safe(renderLog);
  else if (active === 'brain') safe(renderBrain);
  safe(measureClamps);
}

let hash = '';
try { hash = decodeURIComponent((location.hash || '').slice(1)); } catch (e) { hash = ''; }
show(TAB_OF[hash] || 'today', false, true);
dash.onData(render);
